<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080d"><meta name="description" content="هسته مرکزی هوش مصنوعی برای ساخت و اجرای پروژه‌ها">
<title>{% block title %}AI-Agent-Manager{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
<header class="topbar">
  <a href="/" class="brand"><span class="brand-mark">✦</span><span><b>AI-Agent-Manager</b><small>هسته مرکزی هوش مصنوعی</small></span></a>
  <nav class="desktop-nav">
    <a href="/">خانه</a><a href="/app">Command Center</a><a href="/projects">پروژه‌ها</a><a href="/execute">اجرا</a><a href="/audit">ممیزی</a>
  </nav>
  <div class="top-actions"><button class="icon-btn" onclick="toggleDarkMode()" aria-label="تغییر حالت نمایش">◐</button><a href="/app" class="top-cta">ورود به مرکز فرمان</a></div>
</header>
<main class="page-shell">{% block content %}{% endblock %}</main>
<footer class="site-footer"><span>AI-Agent-Manager</span><span>Autonomous Agentic Development Platform</span><span>v1.0</span></footer>
<div id="toast-container"></div>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script>
function toggleDarkMode(){document.documentElement.classList.toggle('light');localStorage.setItem('lightMode',document.documentElement.classList.contains('light'));}
if(localStorage.getItem('lightMode')==='true')document.documentElement.classList.add('light');
function showToast(message,type='info'){const t=document.createElement('div');t.className='toast '+type;t.textContent=message;document.getElementById('toast-container').appendChild(t);setTimeout(()=>t.remove(),3200);}
</script>
{% block scripts %}{% endblock %}
</body></html>

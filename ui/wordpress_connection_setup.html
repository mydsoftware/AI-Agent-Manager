<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اتصال سایت WordPress</title><style>body{font-family:Tahoma,Arial;background:#f5f7fb;margin:0;padding:24px;color:#172033}.box{max-width:720px;margin:auto;background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:24px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.step{padding:8px 12px;border-radius:20px;background:#eef1f6}.step.active{background:#172033;color:#fff}.field{margin:16px 0}label{display:block;margin-bottom:7px;font-weight:bold}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3df;border-radius:8px}button{padding:12px 18px;border:0;border-radius:8px;cursor:pointer;background:#172033;color:#fff}.note{background:#fff8e1;border:1px solid #f0d47a;padding:12px;border-radius:8px}.status{margin-top:18px;padding:14px;border-radius:8px;background:#eef7ee}.ok{background:#e8f7ed}.bad{background:#fff0f0}</style></head>
<body><main class="box"><h1>اتصال سایت WordPress مشتری</h1><p>قبل از اجرای هر اقدام، اتصال و سطح دسترسی سایت بررسی می‌شود.</p><div class="steps"><span class="step active">۱. آدرس سایت</span><span class="step">۲. کاربر مدیر</span><span class="step">۳. Application Password</span><span class="step">۴. Agent Token</span><span class="step">۵. تست اتصال</span></div><div class="field"><label for="site">آدرس سایت</label><input id="site" type="url" placeholder="https://example.com"></div><div class="field"><label for="user">کاربر مدیر</label><input id="user" autocomplete="username"></div><div class="field"><label for="app-pass">Application Password</label><input id="app-pass" type="password" autocomplete="new-password"></div><div class="field"><label for="token">Agent Token</label><input id="token" type="password" autocomplete="new-password"></div><div class="note">اطلاعات حساس نباید داخل کد، گزارش Audit یا URL ذخیره شوند.</div><p><button type="button" id="test">تست اتصال</button></p><div id="status" class="status" hidden></div><script>
const testButton=document.getElementById('test');
const status=document.getElementById('status');
function show(message,ok=false){status.hidden=false;status.textContent=message;status.className='status '+(ok?'ok':'bad');}
testButton.addEventListener('click',async()=>{
 const site=document.getElementById('site').value.trim();
 const user=document.getElementById('user').value.trim();
 const appPassword=document.getElementById('app-pass').value;
 const token=document.getElementById('token').value;
 if(!site||!user||!appPassword||!token){show('همه اطلاعات اتصال را وارد کنید.');return;}
 testButton.disabled=true;testButton.textContent='در حال بررسی...';show('در حال بررسی اتصال، احراز هویت و Endpoint...');
 try{
  const response=await fetch('/api/wordpress/connection/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({site_url:site,username:user,application_password:appPassword,agent_token:token})});
  const data=await response.json();
  if(!response.ok) throw new Error(data.message||'بررسی اتصال ناموفق بود.');
  if(data.reachable&&data.authenticated&&data.writer_endpoint_available){show('اتصال موفق است و سایت برای اجرای Audit آماده است. اجرای Write فقط طبق Policy انجام می‌شود.',true);}
  else if(!data.reachable){show('سایت در دسترس نیست: '+data.message);}
  else if(!data.authenticated){show('سایت در دسترس است، اما احراز هویت Agent ناموفق است: '+data.message);}
  else{show('سایت در دسترس است، اما Endpoint اختصاصی Agent آماده نیست: '+data.message);}
 }catch(error){show('خطا در بررسی اتصال: '+error.message);}
 finally{testButton.disabled=false;testButton.textContent='تست اتصال';}
});
</script></main></body></html>

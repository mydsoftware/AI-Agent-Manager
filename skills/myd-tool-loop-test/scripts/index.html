<!doctype html>
<html><body>
<script>
window["ai_gallery_get_result"] = async function(data, secret) {
  try {
    const input = JSON.parse(data || "{}");
    if (!input.expression) throw new Error("expression الزامی است.");
    if (!/^[0-9+*\-/%().\s]+$/.test(input.expression)) {
      throw new Error("فقط عبارت ریاضی ساده مجاز است.");
    }
    const result = Function("return (" + input.expression + ")")();
    return JSON.stringify({result});
  } catch (error) {
    return JSON.stringify({error: error.message || String(error)});
  }
};
</script>
</body></html>

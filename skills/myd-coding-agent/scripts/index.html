<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MYD Coding Agent</title>
</head>
<body>
<script>
(function () {
  const API = "https://api.github.com";

  function authHeaders(secret, write) {
    const headers = {
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
    if (secret && String(secret).trim()) {
      headers.Authorization = "Bearer " + String(secret).trim();
    }
    if (write && (!secret || !String(secret).trim())) {
      throw new Error("برای عملیات Write یک GitHub Personal Access Token لازم است.");
    }
    return headers;
  }

  async function github(path, secret, options) {
    const opts = options || {};
    const response = await fetch(API + path, {
      method: opts.method || "GET",
      headers: authHeaders(secret, !!opts.write),
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    const bodyText = await response.text();
    let body;
    try { body = JSON.parse(bodyText); } catch { body = bodyText; }
    if (!response.ok) {
      const message = body && typeof body === "object" && body.message
        ? body.message : "HTTP " + response.status;
      throw new Error(message);
    }
    return body;
  }

  function safePage(value) {
    const n = Number(value);
    return Number.isFinite(n) && n >= 1 ? Math.floor(n) : 1;
  }

  function repoPath(owner, repo) {
    return "/repos/" + encodeURIComponent(owner) + "/" + encodeURIComponent(repo);
  }

  function decodeBase64Utf8(value) {
    const binary = atob(String(value).replace(/\s/g, ""));
    const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
  }

  function required(input, key) {
    const value = String(input[key] || "").trim();
    if (!value) throw new Error(key + " الزامی است.");
    return value;
  }

  async function run(input, secret) {
    const owner = required(input, "owner");
    const repo = required(input, "repo");
    const base = repoPath(owner, repo);
    const page = safePage(input.page);

    switch (input.action) {
      case "repo": {
        const r = await github(base, secret);
        return {
          name: r.name, full_name: r.full_name,
          default_branch: r.default_branch, private: r.private,
          visibility: r.visibility, description: r.description,
          html_url: r.html_url, permissions: r.permissions
        };
      }

      case "file": {
        const path = required(input, "path");
        let url = base + "/contents/" +
          path.split("/").map(encodeURIComponent).join("/");
        if (input.ref) url += "?ref=" + encodeURIComponent(String(input.ref));
        const item = await github(url, secret);
        if (Array.isArray(item)) {
          return {
            type: "directory", path,
            items: item.map(x => ({
              name: x.name, path: x.path, type: x.type, size: x.size
            }))
          };
        }
        if (item.content) {
          return {
            type: "file", name: item.name, path: item.path,
            sha: item.sha, size: item.size,
            content: decodeBase64Utf8(item.content)
          };
        }
        return item;
      }

      case "search": {
        const query = required(input, "query");
        const scopedQuery = query.includes("repo:")
          ? query : query + " repo:" + owner + "/" + repo;
        const r = await github(
          "/search/code?q=" + encodeURIComponent(scopedQuery) +
          "&per_page=20&page=" + page, secret
        );
        return {
          total_count: r.total_count,
          items: (r.items || []).map(x => ({
            name: x.name, path: x.path, sha: x.sha, html_url: x.html_url
          }))
        };
      }

      case "issues": {
        const r = await github(
          base + "/issues?state=open&per_page=20&page=" + page, secret
        );
        return (r || []).filter(x => !x.pull_request).map(x => ({
          number: x.number, title: x.title, state: x.state,
          user: x.user && x.user.login, html_url: x.html_url
        }));
      }

      case "pulls": {
        const r = await github(
          base + "/pulls?state=open&per_page=20&page=" + page, secret
        );
        return (r || []).map(x => ({
          number: x.number, title: x.title, state: x.state, draft: x.draft,
          user: x.user && x.user.login, head: x.head && x.head.ref,
          base: x.base && x.base.ref, html_url: x.html_url
        }));
      }

      case "commits": {
        let url = base + "/commits?per_page=20&page=" + page;
        if (input.ref) url += "&sha=" + encodeURIComponent(String(input.ref));
        const r = await github(url, secret);
        return (r || []).map(x => ({
          sha: x.sha, message: x.commit && x.commit.message,
          author: x.commit && x.commit.author && x.commit.author.name,
          date: x.commit && x.commit.author && x.commit.author.date,
          html_url: x.html_url
        }));
      }

      case "create_branch": {
        const branch = required(input, "branch");
        const from = String(input.ref || input.base || "").trim();
        if (!from) throw new Error("ref یا base برای branch مبدا الزامی است.");

        let sourceSha = from;
        if (!/^[0-9a-f]{40}$/i.test(from)) {
          const refUrl = base + "/git/ref/heads/" +
            from.split("/").map(encodeURIComponent).join("/");
          const sourceRef = await github(refUrl, secret);
          sourceSha = sourceRef.object && sourceRef.object.sha;
          if (!sourceSha) throw new Error("SHA branch مبدا پیدا نشد.");
        }

        const r = await github(base + "/git/ref", secret, {
          method: "POST", write: true,
          body: { ref: "refs/heads/" + branch, sha: sourceSha }
        });
        return { action: "create_branch", branch, ref: r.ref, sha: r.object && r.object.sha };
      }

      case "create_file": {
        const path = required(input, "path");
        const content = String(input.content == null ? "" : input.content);
        const message = required(input, "message");
        const body = { message, content: btoa(unescape(encodeURIComponent(content))) };
        if (input.branch) body.branch = String(input.branch);
        const r = await github(base + "/contents/" +
          path.split("/").map(encodeURIComponent).join("/"), secret, {
            method: "PUT", write: true, body
        });
        return {
          action: "create_file", path,
          branch: input.branch || null,
          commit_sha: r.commit && r.commit.sha,
          content_sha: r.content && r.content.sha,
          html_url: r.content && r.content.html_url
        };
      }

      case "update_file": {
        const path = required(input, "path");
        const sha = required(input, "sha");
        const content = String(input.content == null ? "" : input.content);
        const message = required(input, "message");
        const body = {
          message,
          content: btoa(unescape(encodeURIComponent(content))),
          sha
        };
        if (input.branch) body.branch = String(input.branch);
        const r = await github(base + "/contents/" +
          path.split("/").map(encodeURIComponent).join("/"), secret, {
            method: "PUT", write: true, body
        });
        return {
          action: "update_file", path,
          branch: input.branch || null,
          commit_sha: r.commit && r.commit.sha,
          content_sha: r.content && r.content.sha,
          html_url: r.content && r.content.html_url
        };
      }

      case "delete_file": {
        const path = required(input, "path");
        const sha = required(input, "sha");
        const message = required(input, "message");
        const body = { message, sha };
        if (input.branch) body.branch = String(input.branch);
        const r = await github(base + "/contents/" +
          path.split("/").map(encodeURIComponent).join("/"), secret, {
            method: "DELETE", write: true, body
        });
        return {
          action: "delete_file", path,
          branch: input.branch || null,
          commit_sha: r.commit && r.commit.sha
        };
      }

      case "create_pr": {
        const head = required(input, "head");
        const baseBranch = required(input, "base");
        const title = required(input, "title");
        const body = String(input.body || "");
        const r = await github(base + "/pulls", secret, {
          method: "POST", write: true,
          body: { title, head, base: baseBranch, body }
        });
        return {
          action: "create_pr", number: r.number, title: r.title,
          state: r.state, head: r.head && r.head.ref,
          base: r.base && r.base.ref, html_url: r.html_url
        };
      }

      default:
        throw new Error(
          "action نامعتبر است: repo, file, search, issues, pulls, commits, " +
          "create_branch, create_file, update_file, delete_file, create_pr"
        );
    }
  }

  window["ai_edge_gallery_get_result"] = async function (data, secret) {
    try {
      const input = JSON.parse(data || "{}");
      return JSON.stringify({ result: await run(input, secret) });
    } catch (error) {
      return JSON.stringify({
        error: "MYD Coding Agent: " +
          (error && error.message ? error.message : String(error))
      });
    }
  };
})();
</script>
</body>
</html>

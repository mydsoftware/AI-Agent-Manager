name: Session Contract

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  session-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_session_contract.py

name: Session Contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: session-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4
      - name: آماده‌سازی Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: نصب وابستگی‌ها
        run: python -m pip install -r requirements.txt
      - name: اجرای قرارداد Session
        run: python -m pytest -q tests/test_session_contract.py

name: E2E Project Factory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: فراخوانی Global MCP مستقرشده
        id: create
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          NAME: ai-agent-e2e-${{ github.run_id }}
          PLAN: '{"summary":"ساخت یک فروشگاه نمایشی فارسی و راست‌چین با HTML و CSS و JavaScript، اجرای آزمون‌های پایه و بررسی امنیتی و ثبت نتیجه نهایی.","files":[{"path":"site/index.html","content":"<!doctype html>\n<html lang=\"fa\" dir=\"rtl\">\n<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>فروشگاه نمونه</title><link rel=\"stylesheet\" href=\"styles.css\"></head>\n<body><main><h1>فروشگاه نمونه فارسی</h1><p>این صفحه برای آزمون کارخانه پروژه ساخته شده است.</p><button id=\"demo\" type=\"button\">نمایش پیام</button><p id=\"message\" aria-live=\"polite\"></p></main><script src=\"app.js\"></script></body>\n</html>\n"},{"path":"site/styles.css","content":"*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f5f5;color:#222}main{max-width:720px;margin:12vh auto;padding:32px;background:#fff;border-radius:16px;text-align:right}button{padding:10px 18px;border:0;border-radius:8px;cursor:pointer}"},{"path":"site/app.js","content":"document.getElementById('demo').addEventListener('click',()=>{document.getElementById('message').textContent='عملیات با موفقیت انجام شد.';});\n"},{"path":"README.md","content":"# فروشگاه نمونه فارسی\n\nاین پروژه به‌صورت خودکار توسط AI-Agent-Manager ساخته شده است.\n\nتمام محتوای محصول و مستندات این نمونه فارسی و راست‌چین است.\n"}],"commands":["python -c \"from pathlib import Path; files=['site/index.html','site/styles.css','site/app.js','README.md']; assert all(Path(p).is_file() and Path(p).stat().st_size > 0 for p in files); print('آزمون وجود و اندازه فایل‌ها موفق بود.')\"","python -c \"from pathlib import Path; text=Path('site/index.html').read_text(encoding='utf-8'); assert 'lang=\\\"fa\\\"' in text and 'dir=\\\"rtl\\\"' in text; print('آزمون فارسی و راست‌چین موفق بود.')\""] ,"done":true,"language":"fa","direction":"rtl"}'
        run: |
          set -euo pipefail
          test -n "$MCP_ACCESS_TOKEN"
          BODY=$(python - <<'PY'
          import json, os
          payload={"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"create_project_repository","arguments":{"name":os.environ["NAME"],"description":"مخزن موقت آزمون سراسری AI-Agent-Manager","request":"یک فروشگاه نمایشی فارسی و راست‌چین بساز، آزمون‌های پایه و بررسی امنیتی را اجرا کن، خطاهای مسدودکننده را اصلاح کن و نتیجه نهایی را ثبت کن.","project_type":"website","private":True,"plan_json":os.environ["PLAN"]}}}
          print(json.dumps(payload,ensure_ascii=False))
          PY
          )
          curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer ${MCP_ACCESS_TOKEN}" -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" -H "MCP-Protocol-Version: 2025-03-26" --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"AI-Agent-Manager-E2E","version":"1.2"}}}' "https://ai-agent-manager-global-mcp.yusefimohammad.workers.dev/mcp" | tee /tmp/mcp-init.txt
          curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer ${MCP_ACCESS_TOKEN}" -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" -H "MCP-Protocol-Version: 2025-03-26" --data "$BODY" "https://ai-agent-manager-global-mcp.yusefimohammad.workers.dev/mcp" | tee /tmp/mcp-result.txt
          python - <<'PY'
          import json,re
          raw=open('/tmp/mcp-result.txt',encoding='utf-8-sig').read(); matches=re.findall(r'data:\s*(\{.*\})',raw)
          if not matches: raise SystemExit('MCP هیچ رویداد JSON-RPC برنگرداند')
          event=json.loads(matches[-1]); result=event.get('result',{}); text=result.get('content',[{}])[0].get('text','')
          payload=json.loads(text)
          if payload.get('status') not in {'agent-started','completed'}: raise SystemExit(f'عامل خودکار شروع نشد: {payload}')
          repository=payload.get('repository'); url=payload.get('url'); execution=payload.get('execution',{})
          run_id=execution.get('workflow_run_id')
          if not repository or '/' not in repository: raise SystemExit(f'Repository نامعتبر: {repository!r}')
          if not run_id: raise SystemExit(f'شناسه اجرای Agent دریافت نشد: {payload}')
          open('/tmp/repository.txt','w').write(repository); open('/tmp/repository-url.txt','w').write(url or ''); open('/tmp/agent-run-id.txt','w').write(str(run_id))
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
          REPOSITORY=$(cat /tmp/repository.txt); URL=$(cat /tmp/repository-url.txt); RUN_ID=$(cat /tmp/agent-run-id.txt)
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"; echo "repository_url=$URL" >> "$GITHUB_OUTPUT"; echo "agent_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Repository: $REPOSITORY"; echo "Agent workflow run: $RUN_ID"; echo "URL: $URL"

      - name: بررسی Repository و Workflow عامل
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ steps.create.outputs.repository }}
        run: |
          set -euo pipefail
          test -n "$GH_PAT"
          curl -fsS -H "Authorization: Bearer ${GH_PAT}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPOSITORY}/contents/.github/workflows/agent.yml?ref=main" >/tmp/agent-workflow.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/agent-workflow.json')); assert d.get('name')=='agent.yml'; print('Workflow عامل خودکار در Repository مقصد وجود دارد.')
          PY

      - name: بررسی مستقیم وضعیت Workflow عامل
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ steps.create.outputs.repository }}
          AGENT_RUN_ID: ${{ steps.create.outputs.agent_run_id }}
        run: |
          set -euo pipefail
          test -n "$AGENT_RUN_ID"
          for i in $(seq 1 36); do
            CODE=$(curl -sS -o /tmp/run.json -w '%{http_code}' -H "Authorization: Bearer ${GH_PAT}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPOSITORY}/actions/runs/${AGENT_RUN_ID}")
            if [ "$CODE" = "200" ]; then
              if python - <<'PY'
          import json,sys
          d=json.load(open('/tmp/run.json')); status=d.get('status'); conclusion=d.get('conclusion'); url=d.get('html_url')
          print(json.dumps({'status':status,'conclusion':conclusion,'url':url},ensure_ascii=False))
          if status=='completed':
              if conclusion=='success': sys.exit(0)
              print(f'اجرای Agent شکست خورد: نتیجه={conclusion} نشانی={url}',file=sys.stderr); sys.exit(2)
          sys.exit(1)
          PY
              then
                echo "Agent با موفقیت کامل شد."; exit 0
              else
                RC=$?
                if [ "$RC" = "2" ]; then
                  echo "Agent با شکست واقعی تمام شد." >&2
                  exit 1
                fi
              fi
            else
              echo "در انتظار دسترسی به اجرای Agent؛ HTTP=$CODE"
            fi
            echo "Agent هنوز در حال اجراست؛ تلاش $i/36"
            sleep 10
          done
          echo "Agent در مهلت E2E کامل نشد." >&2
          exit 1

      - name: بررسی خروجی نهایی پروژه
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ steps.create.outputs.repository }}
        run: |
          set -euo pipefail
          for path in site/index.html site/styles.css site/app.js README.md agent/execution-state.json; do
            curl -fsS -H "Authorization: Bearer ${GH_PAT}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPOSITORY}/contents/${path}?ref=main" >/dev/null
            echo "بررسی شد: ${path}"
          done
          echo "بررسی نهایی پروژه E2E موفق بود."

      - name: خلاصه
        env:
          REPOSITORY_URL: ${{ steps.create.outputs.repository_url }}
          REPOSITORY: ${{ steps.create.outputs.repository }}
          AGENT_RUN_ID: ${{ steps.create.outputs.agent_run_id }}
        run: |
          echo "تست E2E کارخانه پروژه با موفقیت کامل شد."
          echo "Repository: ${REPOSITORY}"
          echo "Agent Run ID: ${AGENT_RUN_ID}"
          echo "URL: ${REPOSITORY_URL}"

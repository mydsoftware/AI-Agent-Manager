name: E2E Project Factory

on:
  workflow_dispatch:

permissions:
  contents: read

# این Workflow عمداً فقط با Run workflow اجرا می‌شود.
# هر Commit یا Pull Request نباید آن را اجرا کند.

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: آماده‌سازی تست E2E
        run: |
          echo "تست E2E فقط به‌صورت دستی اجرا شده است."
          echo "Commit: $GITHUB_SHA"
          echo "Run ID: $GITHUB_RUN_ID"
      - name: وضعیت
        run: echo "Workflow آماده اجرای دستی است."
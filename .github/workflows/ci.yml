name: آزمون پیوسته

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4
      - name: آماده‌سازی Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: نصب Chromium برای Playwright
        run: python -m playwright install --with-deps chromium
      - name: بررسی Syntax کل پروژه
        run: python -m compileall -q .
      - name: اجرای همه آزمون‌ها
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4
      - name: آماده‌سازی Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: نصب Chromium برای Playwright
        run: python -m playwright install --with-deps chromium
      - name: آماده‌سازی پکیج قابل انتشار
        run: |
          rm -rf dist artifact-test
          mkdir -p dist/AI-Agent-Manager-v1.0.1
          rsync -a --exclude='.git' --exclude='dist' --exclude='AI-Agent-Manager-v1.0.1.zip' ./ dist/AI-Agent-Manager-v1.0.1/
      - name: تست پکیج قبل از انتشار
        run: |
          rm -rf artifact-test
          mkdir artifact-test
          cp -a dist/AI-Agent-Manager-v1.0.1 artifact-test/AI-Agent-Manager-v1.0.1
          cd artifact-test/AI-Agent-Manager-v1.0.1
          python -m compileall -q .
          pytest -q
      - name: انتشار Artifact مستقیم
        uses: actions/upload-artifact@v4
        with:
          name: AI-Agent-Manager-v1.0.1
          path: dist/AI-Agent-Manager-v1.0.1
          if-no-files-found: error

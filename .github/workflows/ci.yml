name: آزمون پیوسته

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: آماده‌سازی Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: نصب Chromium برای Playwright
        run: python -m playwright install --with-deps chromium

      - name: اجرای همه آزمون‌ها
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: ساخت پکیج انتشار
        run: |
          mkdir -p dist/AI-Agent-Manager
          rsync -a --exclude='.git' --exclude='dist' ./ dist/AI-Agent-Manager/
          tar -czf AI-Agent-Manager.tar.gz -C dist AI-Agent-Manager

      - name: انتشار Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Agent-Manager-package
          path: AI-Agent-Manager.tar.gz
          if-no-files-found: error

name: آزمون پیوسته

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v6
      - name: آماده‌سازی Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: نصب Chromium برای Playwright
        run: python -m playwright install --with-deps chromium
      - name: اجرای همه آزمون‌ها
        run: pytest -q

  generated-site-build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v6
      - name: آماده‌سازی Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: نصب وابستگی‌های سایت
        working-directory: generated-sites/company-registration-app
        run: npm install --no-audit --no-fund
      - name: Build سایت Next.js
        working-directory: generated-sites/company-registration-app
        run: npm run build

  package:
    runs-on: ubuntu-latest
    needs:
      - test
      - generated-site-build
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v6
      - name: آماده‌سازی Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: نصب Chromium برای Playwright
        run: python -m playwright install --with-deps chromium
      - name: آماده‌سازی پکیج قابل انتشار
        run: |
          rm -rf dist artifact-test
          mkdir -p dist/AI-Agent-Manager-v1.0.1
          rsync -a --exclude='.git' --exclude='dist' --exclude='AI-Agent-Manager-v1.0.1.zip' ./ dist/AI-Agent-Manager-v1.0.1/
      - name: تست پکیج قبل از انتشار
        run: |
          rm -rf artifact-test
          mkdir artifact-test
          cp -a dist/AI-Agent-Manager-v1.0.1 artifact-test/AI-Agent-Manager-v1.0.1
          cd artifact-test/AI-Agent-Manager-v1.0.1
          python -m compileall -q .
          pytest -q
      - name: انتشار Artifact مستقیم
        uses: actions/upload-artifact@v4
        with:
          name: AI-Agent-Manager-v1.0.1
          path: dist/AI-Agent-Manager-v1.0.1
          if-no-files-found: error

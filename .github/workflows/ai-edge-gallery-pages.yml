name: Deploy MYD Coding Agent Skill to GitHub Pages

on:
  push:
    branches:
      - feature/manager-core
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: myd-coding-agent-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/manager-core

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Skill artifact
        run: |
          test -f skills/myd-coding-agent/SKILL.md
          test -f skills/myd-tool-loop-test/SKILL.md
          mkdir -p _site
          cp -R skills/myd-coding-agent/. _site/
          mkdir -p _site/skills/myd-tool-loop-test
          cp -R skills/myd-tool-loop-test/. _site/skills/myd-tool-loop-test/
          touch _site/.nojekyll
          test -f _site/SKILL.md
          test -f _site/skills/myd-tool-loop-test/SKILL.md
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

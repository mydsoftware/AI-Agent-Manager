name: Deploy MYD Coding Agent Skill to GitHub Pages

on:
  push:
    branches:
      - feature/manager-core
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: myd-coding-agent-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Skill source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only Skill artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./skills/myd-coding-agent

      - name: Deploy Skill to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

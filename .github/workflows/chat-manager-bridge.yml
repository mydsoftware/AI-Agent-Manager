name: ChatGPT → AI-Agent-Manager Bridge

on:
  push:
    paths:
      - "agent_requests/*.json"
  workflow_dispatch:
    inputs:
      request_file:
        description: "مسیر فایل درخواست در agent_requests"
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: آماده‌سازی Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: اجرای درخواست Manager
        run: |
          echo "External model disabled. ChatGPT is the only AI controller."
          REQUEST_FILE="${{ inputs.request_file }}"
          if [ -z "$REQUEST_FILE" ]; then
            REQUEST_FILE=$(find agent_requests -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)
          fi
          test -n "$REQUEST_FILE"
          python -m manager "$REQUEST_FILE"

name: ساخت اندروید

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK/AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4
      - name: بررسی پروژه اندروید
        run: |
          test -f ./gradlew || { echo 'پروژه Android/Gradle در مسیر android پیدا نشد.'; exit 1; }
      - name: تنظیم JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: اجازه اجرای Gradle Wrapper
        run: chmod +x ./gradlew
      - name: Build Android App - APK
        uses: sparkfabrik/android-build-action@v1.5.0
        with:
          project-path: android
          output-path: android-build.apk
          gradle-task: assembleDebug
      - name: Build AAB release
        run: ./gradlew app:bundleRelease
      - name: Build APK release
        run: ./gradlew app:assembleRelease
      - name: آپلود APK/AAB به Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ github.sha }}
          if-no-files-found: error
          path: |
            android-build.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

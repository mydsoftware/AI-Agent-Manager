name: Deploy Global ChatGPT MCP

on:
  workflow_dispatch:
  push:
    paths:
      - "global-mcp/**"
      - ".github/workflows/deploy-global-mcp.yml"

permissions:
  contents: read

env:
  GLOBAL_MCP_URL: https://ai-agent-manager-global-mcp.yusefimohammad.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: global-mcp
    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: آماده‌سازی Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: نصب وابستگی‌ها
        run: npm install

      - name: بررسی TypeScript
        run: npx tsc --noEmit --allowJs false --target ES2022 --module NodeNext --moduleResolution NodeNext src/index.ts

      - name: بررسی Secretهای اتصال
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$MCP_ACCESS_TOKEN" || { echo "MCP_ACCESS_TOKEN تنظیم نشده است." >&2; exit 1; }
          test -n "$GH_PAT" || { echo "GH_PAT تنظیم نشده است." >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN تنظیم نشده است." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID تنظیم نشده است." >&2; exit 1; }

      - name: تنظیم Secretهای Worker
        run: |
          printf '%s' "$MCP_ACCESS_TOKEN" | npx wrangler secret put MCP_ACCESS_TOKEN
          printf '%s' "$GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: تست Health و اعلام URL
        run: |
          echo "Global MCP URL: $GLOBAL_MCP_URL"
          echo "Health endpoint: $GLOBAL_MCP_URL/health"
          for i in 1 2 3 4 5; do
            response=$(curl -fsS --max-time 15 "$GLOBAL_MCP_URL/health" 2>/dev/null) && {
              echo "Health check: OK"
              echo "Response: $response"
              exit 0
            }
            echo "Health check attempt $i failed; retrying..."
            sleep 5
          done
          echo "Health check failed after 5 attempts." >&2
          exit 1

name: AI-Agent-Manager Execute

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: "مسیر فایل درخواست در agent_requests"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: آماده‌سازی Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: نصب Chromium
        run: python -m playwright install --with-deps chromium

      - name: اعتبارسنجی Request
        shell: bash
        run: |
          test -f "${{ inputs.request_file }}"
          python - <<'PY'
          import json, os
          path = os.environ["REQUEST_FILE"]
          data = json.load(open(path, encoding="utf-8"))
          for key in ("request_id", "agent", "url"):
              if not data.get(key):
                  raise SystemExit(f"فیلد الزامی وجود ندارد: {key}")
          PY
        env:
          REQUEST_FILE: ${{ inputs.request_file }}

      - name: اجرای Agent
        shell: bash
        run: |
          mkdir -p agent_results
          REQUEST_FILE="${{ inputs.request_file }}"
          RESULT_FILE="agent_results/$(basename "$REQUEST_FILE" .json).result.json"
          set +e
          python -m manager "$REQUEST_FILE" | tee "$RESULT_FILE"
          CODE=${PIPESTATUS[0]}
          set -e
          test -s "$RESULT_FILE"
          exit "$CODE"

      - name: انتشار نتیجه
        if: always() && hashFiles('agent_results/*.result.json') != ''
        shell: bash
        run: |
          git config user.name "AI-Agent-Manager"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_results/*.result.json
          git diff --cached --quiet && exit 0
          git commit -m "run: publish agent execution result"
          git push

      - name: Artifact نتیجه
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-execution-result
          path: agent_results/*.result.json
          if-no-files-found: ignore

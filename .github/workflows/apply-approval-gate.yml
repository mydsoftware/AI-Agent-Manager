name: Apply Approval Gate

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_approval_gate.py
      - api/http.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approval gate
        run: python scripts/apply_approval_gate.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/http.py
          git commit -m 'feat: enforce approval gate for sensitive workflows'
          git push
